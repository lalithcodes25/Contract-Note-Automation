name: Run Contract Note Automation Daily

on:
  schedule:
    # Runs every day at 03:00 AM UTC -> 8:30 AM IST 
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual testing from the Actions tab

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
        contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Ghostscript for Camelot)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create .env file and set environment variables securely
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          DOWNLOAD_DIR: downloads
          EXCEL_PATH: trade_book.xlsx
          PDF_PASSWORD: ${{ secrets.PDF_PASSWORD }}
          DRIVE_FILE_ID: ${{ secrets.DRIVE_FILE_ID }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -c "
          import os
          
          # 1. Write clean config values to .env (excluding multiline JSON)
          env_vars = {
              'EMAIL_USER': os.environ.get('EMAIL_USER'),
              'EMAIL_PASS': os.environ.get('EMAIL_PASS'),
              'IMAP_SERVER': os.environ.get('IMAP_SERVER'),
              'DOWNLOAD_DIR': os.environ.get('DOWNLOAD_DIR'),
              'EXCEL_PATH': os.environ.get('EXCEL_PATH'),
              'PDF_PASSWORD': os.environ.get('PDF_PASSWORD'),
              'DRIVE_FILE_ID': os.environ.get('DRIVE_FILE_ID')
          }
          
          with open('.env', 'w') as f:
              for k, v in env_vars.items():
                  if v:
                      f.write(f'{k}={v}\n')
          "
          
          # 2. Safely export GDRIVE_SERVICE_ACCOUNT_JSON and other vars to GITHUB_ENV
          echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> $GITHUB_ENV
          echo "EMAIL_PASS=${{ secrets.EMAIL_PASS }}" >> $GITHUB_ENV
          echo "IMAP_SERVER=${{ secrets.IMAP_SERVER }}" >> $GITHUB_ENV
          echo "DOWNLOAD_DIR=downloads" >> $GITHUB_ENV
          echo "EXCEL_PATH=trade_book.xlsx" >> $GITHUB_ENV
          echo "PDF_PASSWORD=${{ secrets.PDF_PASSWORD }}" >> $GITHUB_ENV
          echo "DRIVE_FILE_ID=${{ secrets.DRIVE_FILE_ID }}" >> $GITHUB_ENV
          
          # Use GitHub's native multiline delimiter for the JSON key
          {
            echo 'GDRIVE_SERVICE_ACCOUNT_JSON<<_EOF_'
            echo '${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}'
            echo '_EOF_'
          } >> $GITHUB_ENV

      - name: Run script
        run: python contract_note_automation.py

      - name: Commit and push updated run_status.json back to repo
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add run_status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update run_status.json [skip ci]" && git push)